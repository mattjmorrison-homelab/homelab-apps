apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattjmorrison-homelab/homelab-cert-manager-config
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
