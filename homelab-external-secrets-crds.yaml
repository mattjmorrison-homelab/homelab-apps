apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-external-secrets-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattjmorrison/homelab-external-secrets-crds
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
