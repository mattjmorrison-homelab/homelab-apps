apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/values.yaml
    - repoURL: https://github.com/mattjmorrison-homelab/homelab-cert-manager
      targetRevision: HEAD
      path: verify
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    syncOptions:
      - CreateNamespace=true
