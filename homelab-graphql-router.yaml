apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-graphql-router
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattjmorrison-homelab/homelab-graphql-router
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: graphql-router
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
