apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-zot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattjmorrison/homelab-zot
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: zot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
