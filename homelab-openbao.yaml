apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-openbao
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/values.yaml
    - repoURL: https://github.com/mattjmorrison-homelab/homelab-openbao
      targetRevision: HEAD
      path: verify
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    syncOptions:
      - CreateNamespace=true
