apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-cert-manager-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattjmorrison-homelab/homelab-cert-manager-crds
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
